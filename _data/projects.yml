# Project cards on the home page, grouped into sections.
# Entries with an icon show it; without one they get a GitHub mark.
# Tags are topics (what the project is about), not tech stack.

- title: Products
  items:
    - name: Leitro
      url: https://leitro.xyz
      icon: /assets/icons/leitro.svg
      desc: AI flashcards made from your own material, with mnemonics for the tricky parts and spaced repetition to make it stick.
      tags: [AI, Learning]

    - name: From The Greats
      url: https://fromthegreats.com
      icon: /assets/icons/fromthegreats.svg
      desc: Books recommended by great builders, investors, and thinkers, with every recommendation linked to its source.
      tags: [Books, Research]

    - name: StakeScope
      url: https://stakescope.app
      icon: /assets/icons/stakescope.png
      desc: Check your NEAR stake, estimated rewards, validator health, and fees without connecting a wallet.
      tags: [Blockchain, Analytics]

    - name: BrainFLOPS
      url: https://brainflops.xyz
      icon: /assets/icons/brainflops.svg
      desc: Compares estimates of the world's AI compute with the compute needed to emulate a human brain, using Epoch AI data.
      tags: [AI, Data visualization]

- title: Open source
  items:
    # Open source, but links to its own site (which links to github.com/seraph-quest/seraph).
    - name: Seraph
      url: https://seraph.quest
      icon: /assets/icons/seraph.svg
      desc: An AI assistant with long-term memory that plans ahead, uses your tools and browser, and keeps you in control of what it does.
      tags: [AI agents, Productivity]

    - name: WorkWall
      url: https://github.com/natgurlain/workwall
      desc: A browser extension that blocks distracting sites during your focus hours and shows where your time actually goes.
      tags: [Productivity]

    - name: Hush
      url: https://github.com/natgurlain/hush
      desc: A browser extension that hides feeds, Shorts, trends and other distractions on YouTube, X, Reddit, Facebook, Instagram and LinkedIn.
      tags: [Productivity]

    - name: Repaint
      url: https://github.com/natgurlain/repaint
      desc: A browser extension for restyling any website with your own CSS, with a live editor and everything kept on your device.
      tags: [Customization]

    - name: Brace
      url: https://github.com/natgurlain/brace
      desc: A browser extension that turns raw JSON into a readable, collapsible tree, keeps numbers exactly as written, and adds a paste-and-format page.
      tags: [Developer tools]

    - name: awesome-llm-architectures
      url: https://github.com/natgurlain/awesome-llm-architectures
      desc: A hands-on curriculum for implementing language model architectures from scratch, from a bigram model to MoE, state-space, and diffusion models.
      tags: [LLMs, Learning]

    - name: Kaggle Bible
      url: https://github.com/natgurlain/kaggle-bible
      desc: An evidence-backed field guide to Kaggle competitions, covering what worked, how it was validated, what it cost, and what transfers.
      tags: [Machine learning, Research]

    - name: MAAS
      url: https://github.com/neurion-ai/maas
      desc: A control plane for supervising Codex coding agents, with governed runs, review and recovery, project memory, and full logs and traces.
      tags: [AI agents, Developer tools]

    - name: alpha-q
      url: https://github.com/natgurlain/alpha-q
      desc: Deep reinforcement learning for Atari, built up step by step from DQN to Rainbow, with MLflow experiment tracking.
      tags: [Reinforcement learning]
